# The website and Sparkle feed share one Pages deployment. gh-pages remains the
# signed feed store; only this workflow deploys the combined artifact to Pages.
name: Deploy Website

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_run:
    workflows: ["Publish Appcast"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Serialize the entire assembly + deployment so an older artifact cannot replace
# a newer feed. A queued run always reads the latest gh-pages when it starts.
concurrency:
  group: website-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          # workflow_run uses current, trusted default-branch sources.
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check site assembly
        run: python3 -m unittest discover -s website -p 'test_*.py' -v

      - name: Check JavaScript syntax
        run: node --check website/script.js

      - name: Checkout signed appcast
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .pages-feed
          persist-credentials: false

      - name: Assemble website and signed appcast
        run: python3 website/build.py --output "$RUNNER_TEMP/pages" --appcast-dir .pages-feed

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
